[package]
name = "dsp-calculator"
version = "0.6.0"
description = "DSP Calculator desktop shell"
authors = ["DSPCalculator"]
edition = "2021"

[lib]
name = "dsp_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde_json = "1"
